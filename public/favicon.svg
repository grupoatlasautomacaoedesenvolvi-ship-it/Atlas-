<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Favicon Atlas Globe</title>
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" />
      <stop offset="100%" stop-color="#0f294a" />
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="24" fill="url(#favGrad)"/>

  <!-- Globe Ring -->
  <circle cx="50" cy="50" r="34" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.45"/>
  <ellipse cx="50" cy="50" rx="16" ry="34" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.35" />
  <path d="M 18 38 Q 50 45 82 38" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.6" />
  <path d="M 18 62 Q 50 55 82 62" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.6" />

  <!-- Integrated "A" -->
  <path d="M 50 22 L 32 72 H 42 L 50 50 Z" fill="#ffffff" />
  <path d="M 50 22 L 68 72 H 58 L 50 50 Z" fill="#cbd5e1" />

  <!-- Checkmark -->
  <path d="M 36 54 L 46 64 L 68 40" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
